<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能巡检机器人二维仿真</title>
  </head>
  <body>
    <main id="app">
      <h1>智能巡检机器人</h1>
      <div id="map-container">
        <canvas id="map-canvas" aria-label="机器人巡检地图"></canvas>
      </div>
      <p id="status" role="status" aria-live="polite">加载中…</p>
      <dl id="readout">
        <div class="readout-row"><dt>位置</dt><dd id="readout-position">—</dd></div>
        <div class="readout-row"><dt>朝向</dt><dd id="readout-heading">—</dd></div>
        <div class="readout-row"><dt>最近结果</dt><dd id="readout-last-result">—</dd></div>
        <div class="readout-row"><dt>序列号</dt><dd id="readout-sequence">—</dd></div>
      </dl>
      <div id="controls">
        <button id="btn-up" class="dir-btn" aria-label="向上移动">↑</button>
        <div id="controls-middle">
          <button id="btn-left" class="dir-btn" aria-label="向左移动">←</button>
          <button id="btn-reset" aria-label="重置位置">重置</button>
          <button id="btn-right" class="dir-btn" aria-label="向右移动">→</button>
        </div>
        <button id="btn-down" class="dir-btn" aria-label="向下移动">↓</button>
      </div>
      <button id="btn-reconnect" hidden>重新连接</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
