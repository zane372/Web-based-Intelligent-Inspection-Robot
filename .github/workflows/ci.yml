name: base-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：默认只读；需要缓存写入/上传制品的 job（cpp-unit、container-smoke）
# 在 job 级单独申请 actions:write。web-check 只读，防止其执行的 npm 脚本
# 拿到 actions:write token 后触发 cd.yml 的 workflow_dispatch（部署/回滚）。
permissions:
  contents: read

concurrency:
  group: base-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Boost, Asio and ccache
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-system-dev libasio-dev ccache

      - name: Cache ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          # 缓存键包含 CMakeLists 与全部 C++ 源码清单，依赖变更即失效重建（SPEC 9.3.4）。
          key: ccache-${{ runner.os }}-${{ hashFiles('backend/CMakeLists.txt', 'backend/**/*.cpp', 'backend/**/*.hpp') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -S backend -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7

  web-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/integration/requirements.txt
      - run: python -m pip install -r tests/integration/requirements.txt
      - run: docker compose up --build -d
      - name: Wait for healthy with bounded timeout
        # 健康等待有期限（conftest 内也有 60s 上限），不能无限挂起（SPEC 9.3.6）。
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo "container did not become healthy in time"
          exit 1
      - name: API integration tests
        run: pytest tests/integration -q --base-url http://127.0.0.1:8080
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Upload compose logs on failure
        if: failure()
        run: |
          docker compose logs --no-color > compose-logs.txt || true
      - name: Upload compose diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop services
        if: always()
        run: docker compose down
