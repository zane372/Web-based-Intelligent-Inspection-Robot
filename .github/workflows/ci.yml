name: base-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: base-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Boost, Asio and ccache
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libboost-system-dev libasio-dev ccache

      - name: Cache ccache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ccache
          # 缓存键包含 CMakeLists 与全部 C++ 源码清单，依赖变更即失效重建（SPEC 9.3.4）。
          key: ccache-${{ runner.os }}-${{ hashFiles('backend/CMakeLists.txt', 'backend/**/*.cpp', 'backend/**/*.hpp') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure
        run: cmake -S backend -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Upload CTest diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctest-logs
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore
          retention-days: 7

  web-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/integration/requirements.txt
      - run: python -m pip install -r tests/integration/requirements.txt
      - run: docker compose up --build -d
      - name: Wait for healthy with bounded timeout
        # 健康等待有期限（conftest 内也有 60s 上限），不能无限挂起（SPEC 9.3.6）。
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then exit 0; fi
            sleep 2
          done
          echo "container did not become healthy in time"
          exit 1
      - name: API integration tests
        run: pytest tests/integration -q --base-url http://127.0.0.1:8080
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Upload compose logs on failure
        if: failure()
        run: |
          docker compose logs --no-color > compose-logs.txt || true
      - name: Upload compose diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-logs
          path: compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop services
        if: always()
        run: docker compose down
