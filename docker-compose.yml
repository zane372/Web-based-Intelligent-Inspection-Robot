services:
  # ---- Traefik 反向代理：对外 HTTP 入口 + 管理面板 ----
  # 对外访问统一经 Traefik（basicAuth 鉴权 + 请求体大小限制），
  # 管理面板仅绑定宿主机回环（127.0.0.1:8082）并单独鉴权。
  traefik:
    # v3.7 起才兼容 Docker 29.x 的 Docker API（v3.5 与 Docker 29 的 API 版本协商
    # 会返回 400，导致 Docker Provider 无法发现容器 → 对外 404）。勿降到 3.7 以下。
    image: traefik:v3.7.18
    container_name: traefik
    restart: unless-stopped
    command:
      - "--configFile=/etc/traefik/traefik.yml"
    healthcheck:
      # 用内置 ping 端点（traefik.yml 已启用 ping: {}），确认 Traefik 本身健康。
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # 对外 HTTP 入口（带 basicAuth + 请求体限制，见 dynamic.yml 中间件）
      - "80:80"
      # 管理面板：仅宿主机回环，避免暴露到局域网/公网
      - "127.0.0.1:8082:8082"
    volumes:
      # 只读挂载 Docker socket，用于自动发现容器 label；
      # 生产环境建议改用 docker-socket-proxy 收紧权限（见 docs/traefik.md）。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - traefik-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: patrol-sim-base:local
    ports:
      # 仅宿主机回环直连（无鉴权），供本地开发/测试/CI 使用；
      # 对外访问请走 Traefik 的 80 端口（带鉴权）。
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      MAP_CONFIG: /app/config/map.json
      STATIC_ROOT: /app/web
      PERCEPTION_CONFIG: /app/config/perception.json
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    # 容器级内存兜底（防御纵深）：请求体缓冲已在解析层封顶 4096，此处再限制
    # 进程失控内存耗尽的影响面（OOM 只杀掉本容器，不影响宿主机）。
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    # Traefik 路由与负载均衡（Docker Provider 自动发现；中间件定义在 dynamic.yml）
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.routers.app.rule=PathPrefix(`/`)"
      - "traefik.http.routers.app.middlewares=app-auth@file,body-limit@file"
      - "traefik.http.services.app.loadbalancer.server.port=8080"
    networks:
      - traefik-net

networks:
  traefik-net:
    driver: bridge
