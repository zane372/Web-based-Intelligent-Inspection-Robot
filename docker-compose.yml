services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: patrol-sim-base:local
    ports:
      # 端口仅绑定宿主机回环；对外暴露需改用 0.0.0.0 并置于带鉴权、
      # 且限制请求体大小（如 nginx client_max_body_size 1k）的反向代理之后。
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8080"
      MAP_CONFIG: /app/config/map.json
      STATIC_ROOT: /app/web
      PERCEPTION_CONFIG: /app/config/perception.json
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
